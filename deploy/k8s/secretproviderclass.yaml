# Mounts the GitHub App private key as a file. It lives in Key Vault and is never written into a manifest or
# an image. There is no API bearer token: callers authenticate with Entra workload identity.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: scansvc
  namespace: artifacts-system
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "REPLACE_WITH_MANAGED_IDENTITY_CLIENT_ID"
    keyvaultName: "REPLACE_WITH_KEY_VAULT_NAME"
    tenantId: "REPLACE_WITH_TENANT_ID"
    objects: |
      array:
        - |
          objectName: scansvc-github-app-key
          objectType: secret
          objectAlias: github-app.pem

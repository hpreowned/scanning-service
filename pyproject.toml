[project]
name = "scansvc"
version = "0.2.0"
description = "GitHub-backed security scan service for AI-generated artifact bundles"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "PyJWT[crypto]==2.10.1",
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
]

[project.optional-dependencies]
azure = ["azure-storage-blob==12.24.0", "azure-identity==1.19.0"]
dev = ["pytest==8.3.4"]

[project.scripts]
scanctl = "scansvc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scansvc"]

[tool.pytest.ini_options]
testpaths = ["tests", "scan-workspace/scanner/tests"]
pythonpath = ["scan-workspace/scanner", "scan-workspace/scanner/tests"]
